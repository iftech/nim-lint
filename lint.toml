# Mandatory. The *exact* lint version required to run the rules.
lintVersion = "1.0.0"

# Mandatory. List of the rules. See the list of available rules at https://iftech.github.io/nim-lint
rules = ["typeNames", "statusLibs"]

skipPaths = ["tests"]

# Optional. This is the configuration for your rules.
[typeNames]

# Optional. How strong you want the issues with this rule reported.
# Available values: hint, error
# Default: hint.
severity = "error"

# Optional. Some rules have settings and this is how you set their values.
# You can use inline tables (`settings = {param: value}`) or a separate table `[rulename.settings]`.
# If this section is skipped, the rule uses its default values.
[typeNames.settings]
minLength = 5
maxLength = 10

[statusLibs]
severity = "hint"
